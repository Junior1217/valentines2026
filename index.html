<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Valentine's Day toyo💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* ===== GLOBAL STYLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe0f0 25%, #ffd4e8 50%, #ffc8e2 75%, #ffbdd9 100%);
            overflow: hidden;
            position: relative;
        }

        /* ===== FLOATING HEARTS BACKGROUND ===== */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            opacity: 0.3;
            animation: float-up 15s infinite ease-in-out;
        }

        @keyframes float-up {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* ===== MAIN CARD ===== */
        .valentine-card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 60px 50px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.3);
            text-align: center;
            transition: all 0.5s ease;
        }

        .valentine-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 70px rgba(255, 105, 180, 0.4);
        }

        /* ===== TYPOGRAPHY ===== */
        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #ff1493;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(255, 20, 147, 0.2);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .intro-text {
            font-size: 1.1rem;
            color: #666;
            line-height: 1.8;
            margin-bottom: 40px;
            font-weight: 300;
        }

        /* ===== INTERACTIVE BUTTON ===== */
        .main-button {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff1493 100%);
            color: white;
            border: none;
            padding: 18px 45px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 20, 147, 0.4);
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .main-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(255, 20, 147, 0.5);
        }

        .main-button:active {
            transform: translateY(-1px);
        }

        .main-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .main-button:hover::before {
            width: 300px;
            height: 300px;
        }

        .main-button span {
            position: relative;
            z-index: 1;
        }

        /* ===== MESSAGE CARD (SEPARATE SCROLLABLE CONTAINER) ===== */
        .message-card {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            max-width: 700px;
            width: 90%;
            max-height: 80vh;
            box-shadow: 0 20px 60px rgba(255, 105, 180, 0.4);
            z-index: 100;
            opacity: 0;
            transition: all 0.5s ease;
        }

        .message-card.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        .message-scroll-container {
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 15px;
            scroll-behavior: smooth;
        }

        /* Custom Scrollbar */
        .message-scroll-container::-webkit-scrollbar {
            width: 8px;
        }

        .message-scroll-container::-webkit-scrollbar-track {
            background: rgba(255, 182, 193, 0.2);
            border-radius: 10px;
        }

        .message-scroll-container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff1493 100%);
            border-radius: 10px;
        }

        .message-scroll-container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #ff1493 0%, #ff6b9d 100%);
        }

        .love-message {
            font-size: 1.1rem;
            color: #333;
            font-weight: 400;
            line-height: 1.9;
            text-align: left;
            white-space: pre-wrap;
        }

        .typewriter-cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background-color: #ff1493;
            animation: blink 0.7s infinite;
            margin-left: 2px;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* ===== TULIP DECORATIONS ===== */
        .tulips-container {
            position: fixed;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .tulip {
            position: absolute;
            font-size: 50px;
            opacity: 0.5;
            animation: sway 3s ease-in-out infinite;
        }

        .tulip-bottom-left {
            bottom: 30px;
            left: 30px;
            animation-delay: 0s;
        }

        .tulip-bottom-right {
            bottom: 30px;
            right: 30px;
            animation-delay: 1s;
        }

        .tulip-top-left {
            top: 30px;
            left: 50px;
            font-size: 40px;
            animation-delay: 0.5s;
        }

        .tulip-top-right {
            top: 30px;
            right: 50px;
            font-size: 40px;
            animation-delay: 1.5s;
        }

        .tulip-mid-left {
            top: 50%;
            left: 20px;
            font-size: 35px;
            animation-delay: 2s;
        }

        .tulip-mid-right {
            top: 50%;
            right: 20px;
            font-size: 35px;
            animation-delay: 2.5s;
        }

        @keyframes sway {
            0%, 100% {
                transform: rotate(-8deg);
            }
            50% {
                transform: rotate(8deg);
            }
        }

        /* ===== CONFETTI HEARTS ===== */
        .confetti-heart {
            position: fixed;
            font-size: 30px;
            pointer-events: none;
            z-index: 1000;
            animation: confetti-fall 3s ease-out forwards;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* ===== MUSIC TOGGLE ===== */
        .music-toggle {
            position: fixed;
            top: 30px;
            right: 30px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            box-shadow: 0 5px 20px rgba(255, 105, 180, 0.3);
            transition: all 0.3s ease;
        }

        .music-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(255, 105, 180, 0.4);
        }

        /* ===== RESPONSIVE DESIGN ===== */
        @media (max-width: 768px) {
            .valentine-card {
                padding: 40px 30px;
            }

            .title {
                font-size: 2.5rem;
            }

            .intro-text {
                font-size: 1rem;
            }

            .main-button {
                padding: 15px 35px;
                font-size: 1rem;
            }

            .love-message {
                font-size: 1rem;
            }

            .music-toggle {
                width: 50px;
                height: 50px;
                font-size: 1.2rem;
                top: 20px;
                right: 20px;
            }

            .message-card {
                padding: 30px 25px;
                max-width: 95%;
                max-height: 85vh;
            }

            .message-scroll-container {
                max-height: 75vh;
            }

            .tulip {
                font-size: 35px;
            }

            .tulip-top-left,
            .tulip-top-right {
                font-size: 30px;
            }

            .tulip-mid-left,
            .tulip-mid-right {
                font-size: 25px;
            }

            .tulip-bottom-left {
                left: 15px;
                bottom: 15px;
            }

            .tulip-bottom-right {
                right: 15px;
                bottom: 15px;
            }
        }

        /* ===== HEART POP ANIMATION ===== */
        @keyframes heart-pop {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            50% {
                transform: scale(1.5);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .heart-pop {
            animation: heart-pop 0.6s ease-out;
        }
    </style>
</head>
<body>
    <!-- Floating Hearts Background -->
    <div class="hearts-container" id="heartsContainer"></div>

    <!-- Tulip Flowers Decoration -->
    <div class="tulips-container">
        <div class="tulip tulip-bottom-left">🌷</div>
        <div class="tulip tulip-bottom-right">🌷</div>
        <div class="tulip tulip-top-left">🌷</div>
        <div class="tulip tulip-top-right">🌷</div>
        <div class="tulip tulip-mid-left">🌷</div>
        <div class="tulip tulip-mid-right">🌷</div>
    </div>

    <!-- Music Toggle Button -->
    <button class="music-toggle" id="musicToggle" title="Toggle Music">🎵</button>

    <!-- Background Music (muted by default) -->
    <audio id="bgMusic" loop>
        <source src="lany_cut.mp3" type="audio/mpeg">
        <!-- Fallback: Using a romantic instrumental as YouTube/Spotify embeds don't work as audio sources -->
    </audio>

    <!-- Main Valentine Card -->
    <div class="valentine-card" id="valentineCard">
        <h1 class="title">Happy Valentine's Day 💕</h1>
        <p class="intro-text">
            Hi Ryza! I made this special page just for you. 
            I wanted to do something different this year to show you how much you mean to me. 
            Click the button below to see what I have to say... 💖
        </p>
        
        <button class="main-button" id="mainButton">
            <span>Read My Message 💌</span>
        </button>
    </div>

    <!-- Scrollable Message Container (appears after button click) -->
    <div class="message-card" id="messageCard">
        <div class="message-scroll-container">
            <p class="love-message" id="loveMessage"></p>
        </div>
    </div>

    <script>
        // ===== YOUR PERSONAL MESSAGE =====
        const personalMessage = `Hi Ryza, mal? kamusta? happy valentines ulit 💖

Alam ko nasabi ko na kanina pero gusto ko lang ulitin kasi deserve mo marinig ulit. I hope today makes you feel extra special, extra loved, at extra appreciated — kasi ganon ka naman talaga sa life ko. Hindi lang tuwing Valentine's, pero araw-araw.

Kamusta araw mo? Sana hindi ka masyado napagod. Kung napagod ka man, sana naisip mo kahit saglit na may isang tao dito na sobrang proud sa'yo. Proud sa sipag mo, sa kindness mo, sa pagiging ikaw. Ang dami mong ginagawa, ang dami mong inaasikaso, pero you still manage to stay soft, caring, and genuine. Ang galing mo don.

Alam mo ba, ang simple lang naman ng happiness ko minsan — isang chat mo lang, okay na. Isang "kumain ka na ba?" mo, solve na. Ang babaw pakinggan pero totoo. You have this way of making ordinary days feel lighter. Parang kahit ang daming iniisip, biglang nagiging manageable kasi nandiyan ka.

Hindi ko man masabi palagi in person, pero sobrang thankful ako na nandiyan ka. Thankful ako sa presence mo, sa time mo, sa effort mo. Hindi man perfect lahat, pero ikaw? Sobra ka nang sapat. And if ever may moments na nagdo-doubt ka sa sarili mo, gusto ko lang sabihin na I see you. I see how much you try. I see how much you care. And that's more than enough.

Valentine's ngayon, oo. Pero for me, hindi lang ito tungkol sa flowers or chocolates. It's about appreciating the person who makes your heart feel safe. And honestly, when I think about that… ikaw agad naiisip ko. Yung comfort, yung peace, yung feeling na "okay lang, kakayanin." You bring that to me.

Sana alam mo na hindi lang kita gusto kapag masaya ka. I'm here kahit sa stressful days mo, sa moody days mo, sa tahimik ka lang na days. Hindi ka burden. Hindi ka "too much." You're just you — and that's exactly why you're special.

So ayun… happy valentines ulit. I hope you feel loved today the same way you make me feel loved. And if ever hindi mo pa nararamdaman yun ngayon, allow me to remind you: you are appreciated, you are valued, and you are someone worth choosing every single day. 💕

Ingat ka palagi. Kumain ka maayos. Smile ka din minsan kahit wala akong joke. And remember, may isang tao dito na masaya kasi ikaw yung kausap niya. 💌`;

        let clickCount = 0;
        let musicPlaying = false;
        let messageShown = false;

        // ===== DOM ELEMENTS =====
        const mainButton = document.getElementById('mainButton');
        const loveMessage = document.getElementById('loveMessage');
        const musicToggle = document.getElementById('musicToggle');
        const bgMusic = document.getElementById('bgMusic');
        const valentineCard = document.getElementById('valentineCard');
        const messageCard = document.getElementById('messageCard');

        // ===== TYPEWRITER ANIMATION WITH AUTO-SCROLL =====
        function typeWriter(text, element, speed = 30) {
            let i = 0;
            element.innerHTML = '';
            const messageCard = document.getElementById('messageCard');
            const scrollContainer = messageCard.querySelector('.message-scroll-container');
            
            // Create cursor element
            const cursor = document.createElement('span');
            cursor.className = 'typewriter-cursor';
            
            function type() {
                if (i < text.length) {
                    // Remove cursor temporarily
                    const cursorElement = element.querySelector('.typewriter-cursor');
                    if (cursorElement) cursorElement.remove();
                    
                    // Add next character
                    element.innerHTML += text.charAt(i);
                    
                    // Add cursor back
                    element.appendChild(cursor);
                    
                    // Auto-scroll to bottom as text appears
                    scrollContainer.scrollTop = scrollContainer.scrollHeight;
                    
                    i++;
                    setTimeout(type, speed);
                } else {
                    // Remove cursor when done
                    setTimeout(() => {
                        const finalCursor = element.querySelector('.typewriter-cursor');
                        if (finalCursor) finalCursor.remove();
                    }, 1000);
                }
            }
            
            type();
        }

        // ===== CREATE FLOATING HEARTS BACKGROUND =====
        function createFloatingHearts() {
            const heartsContainer = document.getElementById('heartsContainer');
            const heartSymbols = ['💕', '💖', '💗', '💝', '💘', '❤️'];
            
            for (let i = 0; i < 20; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart';
                heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 15 + 's';
                heart.style.animationDuration = (15 + Math.random() * 10) + 's';
                heart.style.fontSize = (15 + Math.random() * 15) + 'px';
                heartsContainer.appendChild(heart);
            }
        }

        // ===== GET RANDOM MESSAGE (NO REPEATS) =====
        function getRandomMessage() {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * loveMessages.length);
            } while (randomIndex === lastMessageIndex && loveMessages.length > 1);
            
            lastMessageIndex = randomIndex;
            return loveMessages[randomIndex];
        }

        // ===== CREATE CONFETTI HEARTS =====
        function createConfetti() {
            const heartSymbols = ['💕', '💖', '💗', '💝', '💘', '❤️'];
            
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti-heart';
                    confetti.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-50px';
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 50);
            }
        }

        // ===== MAIN BUTTON CLICK EVENT =====
        mainButton.addEventListener('click', function() {
            // Only show message once
            if (messageShown) return;
            
            messageShown = true;
            
            // Create confetti
            createConfetti();
            
            // Fade out the valentine card
            valentineCard.style.opacity = '0';
            valentineCard.style.transform = 'translateY(-20px)';
            
            // Show message card after a delay
            setTimeout(() => {
                valentineCard.style.display = 'none';
                messageCard.classList.add('show');
                
                // Start typewriter animation
                setTimeout(() => {
                    typeWriter(personalMessage, loveMessage, 30);
                }, 300);
            }, 500);
        });

        // ===== MUSIC TOGGLE =====
        musicToggle.addEventListener('click', function() {
            if (musicPlaying) {
                bgMusic.pause();
                musicToggle.textContent = '🎵';
                musicPlaying = false;
            } else {
                bgMusic.play();
                musicToggle.textContent = '🔊';
                musicPlaying = true;
            }
        });

        // ===== INITIALIZE =====
        createFloatingHearts();
        
        // Auto-play music (muted initially due to browser policies)
        bgMusic.volume = 0.3;
    </script>
</body>
</html>
